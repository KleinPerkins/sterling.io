name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        run: |
          brew install actionlint
          actionlint -shellcheck=
      - run: make verify
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            outputs/*receipt.json
            outputs/test-results.txt
            work/test.log
            work/release-build.log
          retention-days: 14
  ci-required:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
