name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
    inputs:
      native_shards:
        description: Optional native shard count for scaling validation (blank uses repository configuration)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository and delivery contracts
        run: |
          python3 Scripts/check-repository.py
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Validate workflows and scan committed history for credentials
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --config .gitleaks.toml
      - name: Plan complete native test coverage
        id: plan
        env:
          REQUESTED_SHARDS: ${{ inputs.native_shards }}
        run: |
          if [ -n "$REQUESTED_SHARDS" ]; then
            python3 Scripts/ci.py plan --shards "$REQUESTED_SHARDS"
          else
            python3 Scripts/ci.py plan
          fi
  native:
    needs: quality
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover and verify the assigned Swift tests
        run: python3 Scripts/ci.py run --platform '${{ matrix.os }}' --index '${{ matrix.shard }}' --shards '${{ matrix.count }}'
      - name: Verify native scripts, signature verifier, and release build once per OS
        if: matrix.shard == 0
        run: |
          make verify-source build
          mkdir -p work/swift-script-cache
          xcrun swift -module-cache-path work/swift-script-cache Scripts/verify-update.swift --self-test
      - name: Save exact test coverage and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.shard }}
          path: outputs/ci/${{ matrix.os }}-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
  ci-required:
    if: always()
    needs: [quality, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful upstream jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$QUALITY_RESULT" = success && test "$NATIVE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: work/ci-artifacts
      - name: Require every discovered test exactly once per OS
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 Scripts/ci.py aggregate --directory work/ci-artifacts --shards '${{ needs.quality.outputs.shards }}'
