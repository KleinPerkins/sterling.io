name: App auto-merge
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: sterling-app-maintenance
  cancel-in-progress: false
jobs:
  dependencies:
    if: >-
      github.repository == 'KleinPerkins/sterling.io' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'dependabot/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: Scripts
      - name: Mint repository-scoped maintenance App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Reconcile all eligible dependency updates
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CI_READ_TOKEN: ${{ github.token }}
          REVIEWER_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: python3 Scripts/dependency-maintenance.py
